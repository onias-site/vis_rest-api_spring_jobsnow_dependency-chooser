server.port=8081
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
# origins that may call this API from a browser (CcpCorsAndMethodsFilter): the front end in production and on the
# developer machine; any other origin gets no CORS header and its preflight answers 403
ccp.cors.allowed-origins=https://onias.site,https://www.onias.site,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000
